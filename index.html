<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: ws: wss:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self';">
  <title>Uinfor | NetTopology</title>
  <meta name="description" content="Herramienta interactiva para el diseño, documentación y diagramado de topologías de red con gestión de bocas, puertos y direccionamiento IP.">
  <link rel="manifest" href="./manifest.webmanifest?v=4">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NetTopology">
  <link rel="icon" type="image/png" href="./uinfor-icon-192.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-locked">
  <div id="workspace-root"></div>

  
  <div id="auth-gate-overlay" class="auth-gate-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-gate-title">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="Uinforlogo2.png" alt="Uinfor Logo" class="auth-brand-logo">
        <div class="auth-brand-text">
          <h1 id="auth-gate-title">Uinfor <span class="brand-badge">NetTopology</span></h1>
          <p>Inicia sesión para acceder al espacio de trabajo</p>
        </div>
      </div>

      <div id="auth-loading-state" class="auth-loading-state">
        <span class="auth-spinner" aria-hidden="true"></span>
        <span>Verificando sesión...</span>
      </div>

      <form id="auth-login-form" class="auth-login-form" style="display: none;" novalidate>
        <div id="auth-config-notice" class="auth-config-notice" role="status" style="display: none;">
          <strong>Firebase no configurado:</strong> Completa las credenciales de tu proyecto en el archivo <code>.env</code> (<code>VITE_FIREBASE_*</code>) y reinicia el servidor.
        </div>

        <div id="auth-error-box" class="auth-error-box" role="alert" style="display: none;"></div>

        <div class="form-group">
          <label for="auth-email-input">Correo electrónico</label>
          <input id="auth-email-input" class="form-control" type="email" autocomplete="email" placeholder="usuario@empresa.com" required>
        </div>

        <div class="form-group">
          <label for="auth-password-input">Contraseña</label>
          <div class="auth-password-wrap">
            <input id="auth-password-input" class="form-control" type="password" autocomplete="current-password" placeholder="••••••••" required>
            <button id="btn-auth-toggle-password" class="btn-auth-toggle-password" type="button" title="Mostrar contraseña" aria-label="Mostrar u ocultar contraseña" aria-pressed="false">
              <svg class="icon-eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button id="btn-auth-submit" class="btn btn-primary auth-submit-btn" type="submit">
          Iniciar sesión
        </button>
      </form>

      <div class="auth-footer">
        Acceso restringido a usuarios autorizados en Firebase
      </div>
    </div>
  </div>

  
  <script type="module" src="./src/main.js"></script>
</body>
</html>
